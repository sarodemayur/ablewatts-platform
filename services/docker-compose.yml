name: ablewatts

services:
  postgres:
    image: postgres:16-alpine
    container_name: ablewatts-postgres
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ablewatts_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-ablewatts} -d ${POSTGRES_DB:-ablewatts}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5
    container_name: ablewatts-adminer
    restart: unless-stopped
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ablewatts_postgres_data:
